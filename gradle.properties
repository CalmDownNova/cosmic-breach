# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
# pin the toolchain to the real JDK 21 so Gradle never picks the stray JRE 1.8
org.gradle.java.installations.paths=C:/Program Files/Java/jdk-21

# Parchment parameter names: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
# Environment Properties (https://projects.neoforged.net/neoforged/neoforge)
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.252
loader_version_range=[1,)

# Libraries (versions checked on Modrinth 2026-09-27)
geckolib_version=4.9.3
playeranimator_version=2.0.4+1.21.1-forge
guideme_version=21.1.19
curios_version=9.5.1+1.21.1
# Comparison mods for the Slice 0 gate (dev runtime only, never shipped)
bettercombat_version=2.4.0+1.21.1-neoforge
combatroll_version=2.0.6+1.21.1-neoforge
clothconfig_version=15.0.140+neoforge

